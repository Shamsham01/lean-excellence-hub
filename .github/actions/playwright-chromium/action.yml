name: Install Playwright Chromium (cached)
description: Cache browser binaries keyed by package-lock and install Chromium (and optional browsers) with system dependencies.

inputs:
  browsers:
    description: Space-separated Playwright browser names to install (e.g. "chromium" or "chromium webkit").
    required: false
    default: chromium

runs:
  using: composite
  steps:
    - name: Restore Playwright browser cache
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ inputs.browsers }}

    - name: Install Playwright Chromium
      shell: bash
      run: |
        set -euo pipefail
        browsers="${{ inputs.browsers }}"
        start_epoch="$(date +%s)"
        # shellcheck disable=SC2086
        npx playwright install-deps ${browsers}
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          # shellcheck disable=SC2086
          npx playwright install --no-shell ${browsers}
        else
          # shellcheck disable=SC2086
          npx playwright install ${browsers}
        fi
        end_epoch="$(date +%s)"
        duration="$((end_epoch - start_epoch))"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          cache_state="${{ steps.playwright-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
          echo "- Playwright install [${browsers}] (cache ${cache_state}): ${duration}s" >> "${GITHUB_STEP_SUMMARY}"
        fi
        echo "Playwright install [${browsers}] completed in ${duration}s"
