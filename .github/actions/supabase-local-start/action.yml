name: Start local Supabase (bounded)
description: Start local Supabase with per-attempt timeout, retries, diagnostics, and guaranteed cleanup on failure.

inputs:
  startup-timeout-minutes:
    description: Maximum minutes allowed for each startup attempt.
    required: false
    default: "10"
  max-attempts:
    description: Number of startup attempts before failing the step.
    required: false
    default: "2"
  exclude-services:
    description: Comma-separated Supabase services to exclude from startup.
    required: false
    default: "studio,realtime,logflare,vector,imgproxy"

runs:
  using: composite
  steps:
    - name: Start local Supabase with bounded retries
      shell: bash
      env:
        STARTUP_TIMEOUT_MINUTES: ${{ inputs.startup-timeout-minutes }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        EXCLUDE_SERVICES: ${{ inputs.exclude-services }}
      run: |
        set -euo pipefail

        dump_diagnostics() {
          echo "=== Supabase CLI status ==="
          npx supabase status || true
          echo "=== Docker containers (supabase) ==="
          docker ps -a --filter "name=supabase" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
          echo "=== Recent Supabase container logs ==="
          for container in $(docker ps -a --filter "name=supabase" --format "{{.Names}}" 2>/dev/null || true); do
            echo "--- logs: ${container} ---"
            docker logs --tail 80 "${container}" 2>&1 || true
          done
        }

        release_local_supabase_ports() {
          local ports=(54321 54322 54320 54323 54324 54327 54329)
          if command -v fuser >/dev/null 2>&1; then
            for port in "${ports[@]}"; do
              fuser -k "${port}/tcp" 2>/dev/null || true
            done
          fi
          docker ps -aq --filter "name=supabase" | xargs -r docker rm -f 2>/dev/null || true
        }

        stop_partial_stack() {
          npm run db:stop || true
          release_local_supabase_ports
        }

        exclude_flags=()
        if [ -n "${EXCLUDE_SERVICES}" ]; then
          IFS=',' read -ra excluded <<< "${EXCLUDE_SERVICES}"
          for service in "${excluded[@]}"; do
            trimmed="$(echo "${service}" | xargs)"
            if [ -n "${trimmed}" ]; then
              exclude_flags+=("-x" "${trimmed}")
            fi
          done
        fi

        release_local_supabase_ports

        # Edge functions read these via supabase/config.toml [edge_runtime.secrets]; jobs that
        # omit them in workflow env still need safe local defaults at stack boot.
        export APP_ORIGIN="${APP_ORIGIN:-http://127.0.0.1:3000}"
        export AUTH_EMAIL_FROM="${AUTH_EMAIL_FROM:-onboarding@test.test}"
        export AUTH_EMAIL_FROM_NAME="${AUTH_EMAIL_FROM_NAME:-Lean Excellence Hub}"

        attempt=1
        while [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; do
          echo "Supabase startup attempt ${attempt}/${MAX_ATTEMPTS} (timeout ${STARTUP_TIMEOUT_MINUTES}m)"
          release_local_supabase_ports
          start_epoch="$(date +%s)"
          if timeout "${STARTUP_TIMEOUT_MINUTES}m" npx supabase start "${exclude_flags[@]}"; then
            end_epoch="$(date +%s)"
            duration="$((end_epoch - start_epoch))"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "- Supabase startup (attempt ${attempt}, excludes: ${EXCLUDE_SERVICES:-none}): ${duration}s" >> "${GITHUB_STEP_SUMMARY}"
            fi
            echo "Local Supabase is ready."
            npx supabase status
            exit 0
          fi

          echo "Supabase startup attempt ${attempt} failed or timed out." >&2
          dump_diagnostics
          stop_partial_stack

          attempt=$((attempt + 1))
          if [ "${attempt}" -le "${MAX_ATTEMPTS}" ]; then
            echo "Retrying Supabase startup in 10 seconds..."
            sleep 10
          fi
        done

        dump_diagnostics
        echo "Local Supabase failed to start after ${MAX_ATTEMPTS} attempt(s)." >&2
        exit 1
