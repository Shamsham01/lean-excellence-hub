name: Supabase-backed Playwright shard
description: Seed demo data and run a bounded Playwright shard against an already-running local Supabase stack.

inputs:
  shard-label:
    description: Human-readable shard label for timing output.
    required: true
  spec-list:
    description: Space-separated Playwright spec paths for this shard.
    required: true

runs:
  using: composite
  steps:
    - name: Seed demo data
      shell: bash
      run: ./scripts/ci/timed.sh "Seed demo (${{ inputs.shard-label }})" npm run db:seed-demo

    - name: Playwright Supabase-backed E2E
      shell: bash
      run: |
        set -euo pipefail
        eval "$(npx supabase status -o env)"
        export E2E_WITH_SUPABASE=1
        export SUPABASE_DB_URL="$DB_URL"
        export APP_ORIGIN=http://127.0.0.1:3000
        export AUTH_RATE_LIMIT_PEPPER=ci-only-pepper-that-is-at-least-32-characters
        export AI_ENABLED=1
        export AI_PROVIDER=fake
        export AI_ALLOW_FAKE_PROVIDER=1
        export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
        export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
        export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
        export CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        ./scripts/ci/timed.sh "Playwright (${{ inputs.shard-label }})" npx playwright test ${{ inputs.spec-list }} --workers=1 --retries=0
