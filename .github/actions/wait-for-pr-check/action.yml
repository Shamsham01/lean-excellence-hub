name: Wait for pull request check
description: Poll GitHub workflow runs or check runs until a required gate completes successfully on the pull request head SHA.

inputs:
  check-name:
    description: Exact check run name to wait for when workflow-file is empty.
    required: false
    default: ""
  workflow-file:
    description: Workflow file path (for example ci-fast.yml) to wait for instead of a check run name.
    required: false
    default: ""
  timeout-minutes:
    description: Maximum minutes to wait before failing.
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Wait for required gate
      uses: actions/github-script@v7
      env:
        CHECK_NAME: ${{ inputs.check-name }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      with:
        script: |
          const checkName = process.env.CHECK_NAME;
          const workflowFile = process.env.WORKFLOW_FILE;
          const timeoutMinutes = Number(process.env.TIMEOUT_MINUTES);
          const sha =
            context.payload.pull_request?.head?.sha ??
            context.payload.workflow_run?.head_sha ??
            context.sha;
          const deadline = Date.now() + timeoutMinutes * 60 * 1000;

          async function waitForWorkflowRun() {
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const workflow = workflows.workflows.find(
              (item) => item.path === `.github/workflows/${workflowFile}`,
            );

            if (!workflow) {
              core.setFailed(`Workflow file not found: ${workflowFile}`);
              return;
            }

            core.info(`Waiting for ${workflowFile} on ${sha}`);

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                head_sha: sha,
                event: "pull_request",
                per_page: 20,
              });

              const activeRuns = data.workflow_runs
                .filter((run) => run.status !== "waiting")
                .sort(
                  (left, right) =>
                    new Date(right.created_at).getTime() -
                    new Date(left.created_at).getTime(),
                );

              const latestRun = activeRuns[0];

              if (!latestRun) {
                core.info(`${workflowFile} has not started yet`);
              } else {
                core.info(
                  `${workflowFile} status=${latestRun.status} conclusion=${latestRun.conclusion ?? "pending"}`,
                );

                if (latestRun.status === "completed") {
                  if (latestRun.conclusion === "success") {
                    return;
                  }

                  core.setFailed(
                    `${workflowFile} completed with conclusion ${latestRun.conclusion}`,
                  );
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(
              `Timed out after ${timeoutMinutes} minute(s) waiting for ${workflowFile}`,
            );
          }

          async function waitForCheckRun() {
            core.info(`Waiting for check "${checkName}" on ${sha}`);

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: checkName,
                per_page: 100,
              });

              const activeRuns = data.check_runs
                .filter((run) => run.conclusion !== "skipped")
                .sort(
                  (left, right) =>
                    new Date(right.started_at).getTime() -
                    new Date(left.started_at).getTime(),
                );

              const latestRun = activeRuns[0];

              if (!latestRun) {
                core.info(`"${checkName}" has not started yet`);
              } else {
                core.info(
                  `"${checkName}" status=${latestRun.status} conclusion=${latestRun.conclusion ?? "pending"}`,
                );

                if (latestRun.status === "completed") {
                  if (latestRun.conclusion === "success") {
                    return;
                  }

                  core.setFailed(
                    `"${checkName}" completed with conclusion ${latestRun.conclusion}`,
                  );
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(
              `Timed out after ${timeoutMinutes} minute(s) waiting for "${checkName}"`,
            );
          }

          if (workflowFile) {
            await waitForWorkflowRun();
            return;
          }

          if (!checkName) {
            core.setFailed("Either workflow-file or check-name must be provided.");
            return;
          }

          await waitForCheckRun();
