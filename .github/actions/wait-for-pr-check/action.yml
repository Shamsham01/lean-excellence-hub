name: Wait for pull request check
description: Poll GitHub check runs until a named check completes successfully on the pull request head SHA.

inputs:
  check-name:
    description: Exact check run name to wait for.
    required: true
  timeout-minutes:
    description: Maximum minutes to wait before failing.
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Wait for required check
      uses: actions/github-script@v7
      env:
        CHECK_NAME: ${{ inputs.check-name }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      with:
        script: |
          const checkName = process.env.CHECK_NAME;
          const timeoutMinutes = Number(process.env.TIMEOUT_MINUTES);
          const sha =
            context.payload.pull_request?.head?.sha ??
            context.payload.workflow_run?.head_sha ??
            context.sha;
          const deadline = Date.now() + timeoutMinutes * 60 * 1000;

          core.info(`Waiting for "${checkName}" on ${sha}`);

          while (Date.now() < deadline) {
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              per_page: 100,
            });

            const matchingRuns = data.check_runs.filter(
              (run) => run.name === checkName,
            );

            if (matchingRuns.length === 0) {
              core.info(`"${checkName}" has not started yet`);
            } else {
              const latestRun = matchingRuns[0];
              core.info(
                `"${checkName}" status=${latestRun.status} conclusion=${latestRun.conclusion ?? "pending"}`,
              );

              if (latestRun.status === "completed") {
                if (latestRun.conclusion === "success") {
                  return;
                }

                core.setFailed(
                  `"${checkName}" completed with conclusion ${latestRun.conclusion}`,
                );
                return;
              }
            }

            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }

          core.setFailed(
            `Timed out after ${timeoutMinutes} minute(s) waiting for "${checkName}"`,
          );
