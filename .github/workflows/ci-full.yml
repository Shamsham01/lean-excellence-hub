name: Full Regression

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ORIGIN: http://127.0.0.1:3000
  AUTH_RATE_LIMIT_PEPPER: ci-only-pepper-that-is-at-least-32-characters
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
  CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  quality:
    name: Full Regression / Quality
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end-smoke:
    name: Full Regression / E2E smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke

  database:
    name: Full Regression / Database
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - uses: ./.github/actions/supabase-local-start
        with:
          startup-timeout-minutes: "10"
          max-attempts: "2"
      - run: npm run db:lint
      - run: npm run test:db
      - name: QA tenant hosted replacement integration (local Supabase)
        timeout-minutes: 75
        shell: bash
        env:
          LEANHUB_ALLOW_QA_TENANT: "1"
          LEANHUB_FORCE_LEGACY_REPLACEMENT_INTEGRATION: "1"
        run: |
          eval "$(npx supabase status -o env)"
          npx vitest run --reporter=verbose tests/integration/qa-tenant-hosted-replacement.test.ts
      - run: npm run db:types
      - name: Confirm committed database types are current
        run: git diff --exit-code -- src/platform/supabase/database.types.ts
      - run: npm run db:seed-demo
      - name: Playwright Supabase-backed E2E
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          export E2E_WITH_SUPABASE=1
          export SUPABASE_DB_URL="$DB_URL"
          export APP_ORIGIN=http://127.0.0.1:3000
          export AUTH_RATE_LIMIT_PEPPER=ci-only-pepper-that-is-at-least-32-characters
          export AI_ENABLED=1
          export AI_PROVIDER=fake
          export AI_ALLOW_FAKE_PROVIDER=1
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
          export CREDENTIAL_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/platform-shell.spec.ts tests/e2e/maturity-journeys.spec.ts tests/e2e/five-s-journeys.spec.ts tests/e2e/gemba-journeys.spec.ts tests/e2e/scheduling-journeys.spec.ts tests/e2e/milestone6-closure.spec.ts tests/e2e/training-journeys.spec.ts tests/e2e/milestone7-closure.spec.ts tests/e2e/milestone8-closure.spec.ts tests/e2e/milestone9-closure.spec.ts tests/e2e/milestone10-closure.spec.ts tests/e2e/milestone11-closure.spec.ts tests/e2e/milestone12-closure.spec.ts tests/e2e/invitation-lifecycle.spec.ts tests/e2e/workforce-provisioning.spec.ts tests/e2e/workforce-bulk-import.spec.ts tests/e2e/suggestion-portfolio.spec.ts --workers=1 --retries=0
      - if: always()
        run: npm run db:stop

  qa-harness-windows:
    name: Full Regression / Windows QA harness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Run cross-platform QA harness unit tests
        shell: pwsh
        run: npm test -- tests/unit/qa-tenant-npm-exec.test.ts tests/unit/qa-tenant-db-cli.test.ts tests/unit/qa-tenant-db-query-result.test.ts tests/unit/qa-tenant-database-types-verify.test.ts tests/unit/qa-tenant-inventory.test.ts tests/unit/qa-tenant-working-tree-verify.test.ts tests/unit/qa-tenant-guards.test.ts tests/unit/qa-tenant-constants.test.ts
      - name: Verify Supabase CLI resolves via npm exec on Windows
        shell: pwsh
        run: npm exec -- supabase --version
