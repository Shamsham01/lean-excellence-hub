name: Full Regression

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ORIGIN: http://127.0.0.1:3000
  AUTH_RATE_LIMIT_PEPPER: ci-only-pepper-that-is-at-least-32-characters
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
  CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  quality-warmup:
    name: Prepare quality gate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow Fast CI to register on synchronize
        run: sleep 30

  changes:
    name: Detect specialised regression scope
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      qa_tenant_replacement: ${{ steps.filter.outputs.qa_tenant_replacement }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            qa_tenant_replacement:
              - "scripts/qa-tenant/**"
              - "tests/integration/qa-tenant-hosted-replacement.test.ts"
              - ".github/workflows/ci-database.yml"
              - ".github/workflows/ci-full.yml"
              - ".github/actions/supabase-local-start/**"

  quality:
    name: Full Regression / Quality
    needs:
      - quality-warmup
    if: >-
      always() &&
      !cancelled() &&
      (needs.quality-warmup.result == 'success' || needs.quality-warmup.result == 'skipped') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Confirm Fast CI / Quality passed for this pull request
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/wait-for-pr-check
        with:
          workflow-file: ci-fast.yml
          timeout-minutes: "12"
      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request'
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "npm ci" npm ci
      - name: Format check
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "format:check" npm run format:check
      - name: Lint
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "lint" npm run lint
      - name: Typecheck
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "typecheck" npm run typecheck
      - name: Unit tests
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "unit tests" npm test
      - name: Production build
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/timed.sh "build" npm run build
      - name: Quality gate summary
        if: always()
        run: |
          {
            echo "## Full Regression / Quality"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "Pull request gate: reused successful \`Fast CI / Quality\` for this commit."
            else
              echo "Main/manual gate: executed the full quality suite on this ref."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  end-to-end-smoke:
    name: Full Regression / E2E smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: ./scripts/ci/timed.sh "npm ci" npm ci
      - uses: ./.github/actions/playwright-chromium
      - name: Playwright smoke tests
        run: ./scripts/ci/timed.sh "Playwright smoke" npm run test:e2e:smoke

  database-core:
    name: Full Regression / Database core
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: ./scripts/ci/timed.sh "npm ci" npm ci
      - uses: ./.github/actions/supabase-local-start
        with:
          startup-timeout-minutes: "8"
          max-attempts: "2"
      - name: Database lint
        run: ./scripts/ci/timed.sh "db:lint" npm run db:lint
      - name: pgTAP database tests
        run: ./scripts/ci/timed.sh "test:db" npm run test:db
      - name: Generate database types
        run: ./scripts/ci/timed.sh "db:types" npm run db:types
      - name: Confirm committed database types are current
        run: git diff --exit-code -- src/platform/supabase/database.types.ts
      - if: always()
        run: npm run db:stop

  qa-recovery:
    name: Full Regression / QA hosted replacement
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.qa_tenant_replacement == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: ./scripts/ci/timed.sh "npm ci" npm ci
      - uses: ./.github/actions/supabase-local-start
        with:
          startup-timeout-minutes: "8"
          max-attempts: "2"
      - name: QA tenant hosted replacement integration (local Supabase)
        timeout-minutes: 18
        shell: bash
        env:
          LEANHUB_ALLOW_QA_TENANT: "1"
          LEANHUB_FORCE_LEGACY_REPLACEMENT_INTEGRATION: "1"
        run: |
          eval "$(npx supabase status -o env)"
          ./scripts/ci/timed.sh "QA hosted replacement integration" npx vitest run --reporter=verbose tests/integration/qa-tenant-hosted-replacement.test.ts
      - if: always()
        run: npm run db:stop

  e2e-shards:
    name: Full Regression / E2E ${{ matrix.label }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: platform
            specs: >-
              tests/e2e/platform-shell.spec.ts
              tests/e2e/maturity-journeys.spec.ts
              tests/e2e/five-s-journeys.spec.ts
              tests/e2e/gemba-journeys.spec.ts
              tests/e2e/scheduling-journeys.spec.ts
              tests/e2e/milestone6-closure.spec.ts
          - label: workforce
            specs: >-
              tests/e2e/training-journeys.spec.ts
              tests/e2e/milestone7-closure.spec.ts
              tests/e2e/invitation-lifecycle.spec.ts
              tests/e2e/workforce-provisioning.spec.ts
              tests/e2e/workforce-bulk-import.spec.ts
          - label: improvement
            specs: >-
              tests/e2e/milestone8-closure.spec.ts
              tests/e2e/milestone9-closure.spec.ts
              tests/e2e/suggestion-portfolio.spec.ts
              tests/e2e/milestone10-closure.spec.ts
              tests/e2e/milestone11-closure.spec.ts
          - label: ai-closure
            specs: tests/e2e/milestone12-closure.spec.ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - name: Install dependencies
        run: ./scripts/ci/timed.sh "npm ci" npm ci
      - uses: ./.github/actions/supabase-local-start
        with:
          startup-timeout-minutes: "8"
          max-attempts: "2"
      - uses: ./.github/actions/playwright-chromium
      - uses: ./.github/actions/supabase-playwright-e2e
        with:
          shard-label: ${{ matrix.label }}
          spec-list: ${{ matrix.specs }}
      - if: always()
        run: npm run db:stop

  database:
    name: Full Regression / Database
    needs:
      - database-core
      - qa-recovery
      - e2e-shards
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.database-core.result == 'success' &&
      (needs.qa-recovery.result == 'success' || needs.qa-recovery.result == 'skipped') &&
      needs.e2e-shards.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish database regression gate summary
        run: |
          {
            echo "## Full Regression / Database gate"
            echo ""
            echo "- Database core: success"
            echo "- QA hosted replacement: ${{ needs.qa-recovery.result }}"
            echo "- Supabase-backed Playwright shards: success"
            echo ""
            echo "All required database and Supabase-backed E2E coverage completed for this ref."
          } >> "$GITHUB_STEP_SUMMARY"

  qa-harness-windows:
    name: Full Regression / Windows QA harness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Run cross-platform QA harness unit tests
        shell: pwsh
        run: npm test -- tests/unit/qa-tenant-npm-exec.test.ts tests/unit/qa-tenant-db-cli.test.ts tests/unit/qa-tenant-db-query-result.test.ts tests/unit/qa-tenant-database-types-verify.test.ts tests/unit/qa-tenant-inventory.test.ts tests/unit/qa-tenant-working-tree-verify.test.ts tests/unit/qa-tenant-guards.test.ts tests/unit/qa-tenant-constants.test.ts
      - name: Verify Supabase CLI resolves via npm exec on Windows
        shell: pwsh
        run: npm exec -- supabase --version
