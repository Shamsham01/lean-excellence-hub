name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  APP_ORIGIN: http://127.0.0.1:3000
  AUTH_RATE_LIMIT_PEPPER: ci-only-pepper-that-is-at-least-32-characters
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_SECRET_KEY: sb_secret_ci_placeholder

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  end-to-end:
    name: Playwright smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    name: Local Supabase database baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:lint
      - run: npm run test:db
      - run: npm run db:types
      - name: Confirm committed database types are current
        run: git diff --exit-code -- src/platform/supabase/database.types.ts
      - run: npm run db:seed-demo
      - name: Playwright Supabase-backed E2E
        shell: bash
        run: |
          eval "$(npx supabase status -o env)"
          export E2E_WITH_SUPABASE=1
          export APP_ORIGIN=http://127.0.0.1:3000
          export AUTH_RATE_LIMIT_PEPPER=ci-only-pepper-that-is-at-least-32-characters
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
          export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/platform-shell.spec.ts tests/e2e/maturity-journeys.spec.ts --workers=1
      - if: always()
        run: npm run db:stop
