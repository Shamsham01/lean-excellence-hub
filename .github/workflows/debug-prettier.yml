name: Debug Prettier

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write tests/e2e/password-recovery.spec.ts
          git diff -- tests/e2e/password-recovery.spec.ts
          test -z "$(git status --porcelain tests/e2e/password-recovery.spec.ts)"
