name: Debug Prettier

on:
  pull_request:
    types:
      - synchronize

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Print formatted file
        run: |
          npx prettier --write tests/e2e/password-recovery.spec.ts
          echo "FORMATTED_BASE64_BEGIN"
          base64 -w 0 tests/e2e/password-recovery.spec.ts
          echo
          echo "FORMATTED_BASE64_END"
