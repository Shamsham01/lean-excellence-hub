name: One-time privacy PR formatting

on:
  push:
    branches: [feature/legal-demo-booking-privacy]

permissions:
  contents: write

jobs:
  prettify:
    if: github.event.head_commit.message == 'ci(privacy): run one-time prettier fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Prettier and remove temporary formatter workflow
        run: |
          npx prettier --write src/app/privacy/demo-bookings/page.tsx src/components/marketing/demo/demo-page.tsx tests/e2e/marketing-demo-booking.spec.ts
          rm .github/workflows/temp-privacy-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/privacy/demo-bookings/page.tsx src/components/marketing/demo/demo-page.tsx tests/e2e/marketing-demo-booking.spec.ts .github/workflows/temp-privacy-format.yml
          git commit -m 'style(privacy): apply prettier to notice and booking tests'
          git push origin HEAD:feature/legal-demo-booking-privacy
