# Next.js on Netlify — OpenNext runtime (not a static SPA publish).
# A catch-all to index.html in the UI breaks /_next/static/* (wrong MIME, unstyled previews).
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
